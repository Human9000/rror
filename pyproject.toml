[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rror"
version = "0.1.0"
description = "A file mirroring and synchronization tool"
readme = "README.md"
requires-python = ">=3.4"
license = {text = "MIT"}
authors = [{name = "Author", email = "author@example.com"}]
keywords = ["mirror", "sync", "file"]

dependencies = ["pytest>=7.0"]

[project.optional-dependencies]
dev = []

[project.scripts]
rror = "rror.cli:main"

[tool.setuptools]
packages = ["rror"]
include-package-data = true

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
rror = [
    "templates/**/*",
    "templates/*/.gitignore",
    "templates/*/.projmirror",
    "templates/*/.mirror/.live",
    "templates/*/.rror",
]
